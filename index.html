<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#050805" />

  <title>卿卿生辰喜乐</title>

  <style>
    :root {
      --white: rgba(255, 255, 255, 0.96);
      --soft-white: rgba(255, 255, 255, 0.72);
      --gold: #ffd36a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #050805;
    }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(
          circle at 27% 42%,
          rgba(34, 57, 30, 0.24),
          transparent 34%
        ),
        radial-gradient(
          circle at 72% 48%,
          rgba(77, 56, 19, 0.08),
          transparent 34%
        ),
        #050805;

      color: var(--white);

      font-family:
        "Songti SC",
        "Noto Serif CJK SC",
        "STSong",
        "SimSun",
        serif;
    }

    /* =========================================================
       FIREWORK BACKGROUND
       ========================================================= */

    #fireworks {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;
      pointer-events: none;
    }

    .background-vignette {
      position: fixed;
      inset: 0;

      z-index: 1;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0, 0, 0, 0.18) 67%,
          rgba(0, 0, 0, 0.48) 100%
        );
    }

    /* =========================================================
       MAIN PAGE
       ========================================================= */

    .page {
      position: relative;
      z-index: 2;

      min-height: 100svh;

      display: grid;
      grid-template-columns:
        minmax(0, 58%)
        minmax(320px, 42%);

      align-items: stretch;
    }

    /* =========================================================
       THREE.JS AREA
       ========================================================= */

    .flower-area {
      position: relative;

      min-width: 0;
      min-height: 100svh;

      overflow: hidden;
    }

    #scene {
      position: absolute;
      inset: 0;

      display: block;

      width: 100%;
      height: 100%;

      outline: none;

      touch-action: pan-y;
    }

    .flower-glow {
      position: absolute;

      left: 50%;
      top: 45%;

      width: 75%;
      aspect-ratio: 1;

      transform: translate(-50%, -50%);

      pointer-events: none;

      background:
        radial-gradient(
          circle,
          rgba(255, 206, 78, 0.075),
          transparent 66%
        );

      filter: blur(30px);
    }

    /* =========================================================
       POEM
       ========================================================= */

    .poem-area {
      position: relative;

      display: flex;
      align-items: center;

      padding:
        max(50px, 7vh)
        clamp(35px, 6vw, 110px)
        max(50px, 7vh)
        clamp(25px, 2vw, 60px);
    }

    .poem {
      width: min(100%, 540px);

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.75),
        0 0 22px rgba(255, 238, 190, 0.05);
    }

    .gold-line {
      width: 38px;
      height: 1px;

      margin-bottom: 28px;

      background:
        linear-gradient(
          90deg,
          rgba(255, 210, 92, 0.95),
          transparent
        );
    }

    .poem p {
      margin: 0 0 25px;

      font-size: clamp(17px, 1.25vw, 23px);
      line-height: 2;

      letter-spacing: 0.1em;
      font-weight: 400;
    }

    .poem p:last-child {
      margin-bottom: 0;
    }

    .ending {
      color: #fff;

      text-shadow:
        0 0 18px rgba(255, 221, 123, 0.14),
        0 2px 10px rgba(0, 0, 0, 0.75);
    }

    .hint {
      position: absolute;

      left: 20px;
      bottom: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 9px;
      letter-spacing: 0.2em;

      color: rgba(255, 255, 255, 0.38);

      text-transform: uppercase;

      pointer-events: none;
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 1000px) and (min-width: 701px) {

      .page {
        grid-template-columns:
          minmax(0, 55%)
          minmax(300px, 45%);
      }

      .poem-area {
        padding-left: 15px;
        padding-right: 35px;
      }

      .poem p {
        font-size: clamp(15px, 1.7vw, 19px);
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      body {
        overflow-y: auto;
      }

      .page {
        display: block;
        min-height: 100svh;
      }

      .flower-area {
        width: 100%;

        /*
          The bouquet gets its own screen section.
          This is what fixes the mobile sizing.
        */
        min-height: 54svh;
        height: 54svh;
      }

      .flower-glow {
        width: 105%;
        top: 48%;
      }

      .poem-area {
        min-height: 46svh;

        display: block;

        padding:
          15px
          max(23px, env(safe-area-inset-right))
          max(48px, calc(28px + env(safe-area-inset-bottom)))
          max(23px, env(safe-area-inset-left));
      }

      .poem {
        width: 100%;
        max-width: 480px;

        margin: 0 auto;

        text-align: center;
      }

      .gold-line {
        margin:
          0 auto
          21px;

        width: 45px;

        background:
          linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
          );
      }

      .poem p {
        margin-bottom: 20px;

        font-size: clamp(14px, 4vw, 18px);
        line-height: 1.85;

        letter-spacing: 0.055em;
      }

      .hint {
        display: none;
      }
    }

    /* Smaller phones */

    @media (max-width: 390px) {

      .flower-area {
        height: 50svh;
        min-height: 50svh;
      }

      .poem-area {
        min-height: 50svh;
        padding-top: 10px;
      }

      .poem p {
        font-size: 14px;
        line-height: 1.72;
      }
    }

    /* Landscape phone */

    @media (
      max-height: 500px
    ) and (
      orientation: landscape
    ) {

      .page {
        display: grid;

        grid-template-columns:
          52%
          48%;
      }

      .flower-area {
        height: 100svh;
        min-height: 100svh;
      }

      .poem-area {
        min-height: 100svh;

        display: flex;

        padding:
          20px
          25px
          20px
          10px;
      }

      .poem {
        text-align: left;
      }

      .gold-line {
        margin:
          0 0
          12px;
      }

      .poem p {
        margin-bottom: 10px;

        font-size: 12px;
        line-height: 1.48;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hint {
        display: none;
      }
    }
  </style>
</head>


<body>

  <!-- Background fireworks -->
  <canvas id="fireworks"></canvas>

  <div class="background-vignette"></div>


  <main class="page">

    <!-- 3D bouquet -->
    <section class="flower-area">

      <canvas
        id="scene"
        aria-hidden="true"
      ></canvas>

      <div class="flower-glow"></div>

      <div class="hint">
        move to admire the flowers
      </div>

    </section>


    <!-- Poem -->
    <section class="poem-area">

      <div class="poem">

        <div class="gold-line"></div>

        <p>
          愿卿长似花初绽，<br>
          无忧无恙少尘埃。<br>
          年年今日同相守，<br>
          共看灯火照楼台。
        </p>

        <p>
          若问此心何所愿，<br>
          唯愿卿安，唯愿卿欢；<br>
          春秋与共，白首不改。
        </p>

        <p class="ending">
          卿卿生辰喜乐，<br>
          愿岁岁长安，年年有我。
        </p>

      </div>

    </section>

  </main>


  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js";


    /* ============================================================
       THREE.JS SETUP
       ============================================================ */

    const canvas =
      document.querySelector("#scene");

    const flowerArea =
      document.querySelector(".flower-area");


    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(
        42,
        1,
        0.1,
        100
      );


    const renderer =
      new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
      1.08;

    renderer.shadowMap.enabled =
      true;

    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;


    /* ============================================================
       LIGHTING
       ============================================================ */

    const hemisphereLight =
      new THREE.HemisphereLight(
        0xfff3ce,
        0x142014,
        1.8
      );

    scene.add(
      hemisphereLight
    );


    const keyLight =
      new THREE.DirectionalLight(
        0xffe1a0,
        4
      );

    keyLight.position.set(
      -4,
      7,
      7
    );

    keyLight.castShadow =
      true;

    scene.add(
      keyLight
    );


    const goldenLight =
      new THREE.PointLight(
        0xffbd42,
        22,
        16,
        2
      );

    goldenLight.position.set(
      -3,
      2,
      5
    );

    scene.add(
      goldenLight
    );


    const rimLight =
      new THREE.PointLight(
        0xfff4d0,
        14,
        15,
        2
      );

    rimLight.position.set(
      3,
      4,
      -2
    );

    scene.add(
      rimLight
    );


    /* ============================================================
       MATERIALS
       ============================================================ */

    const outerPetalMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xffca39,
        roughness: 0.46
      });


    const innerPetalMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xffad22,
        roughness: 0.48
      });


    const centerMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x3a1a09,
        roughness: 0.9
      });


    const seedMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xd56b1d,
        roughness: 0.7
      });


    const stemMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x426d28,
        roughness: 0.8
      });


    const leafMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x668d38,
        roughness: 0.88,
        side: THREE.DoubleSide
      });


    const paperMaterial =
      new THREE.MeshPhysicalMaterial({
        color: 0xcfbd91,
        roughness: 0.85,
        transparent: true,
        opacity: 0.39,
        side: THREE.DoubleSide,
        depthWrite: false
      });


    const paperLightMaterial =
      new THREE.MeshPhysicalMaterial({
        color: 0xf4deb0,
        roughness: 0.85,
        transparent: true,
        opacity: 0.14,
        side: THREE.DoubleSide,
        depthWrite: false
      });


    const ribbonMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xe1b54c,
        roughness: 0.5
      });


    /* ============================================================
       SHARED GEOMETRY
       ============================================================ */

    const petalGeometry =
      new THREE.SphereGeometry(
        1,
        12,
        8
      );


    const centerGeometry =
      new THREE.SphereGeometry(
        1,
        24,
        16
      );


    const seedGeometry =
      new THREE.IcosahedronGeometry(
        1,
        0
      );


    const stemGeometry =
      new THREE.CylinderGeometry(
        1,
        1,
        1,
        10
      );


    const leafGeometry =
      new THREE.SphereGeometry(
        1,
        14,
        8
      );


    /* ============================================================
       BOUQUET
       ============================================================ */

    const bouquet =
      new THREE.Group();

    scene.add(
      bouquet
    );


    const flowerHeads = [];


    function createSunflower(
      radius = 1
    ) {

      const flower =
        new THREE.Group();


      const dummy =
        new THREE.Object3D();


      /*
        OUTER PETALS
      */

      const outerCount =
        28;


      const outerPetals =
        new THREE.InstancedMesh(
          petalGeometry,
          outerPetalMaterial,
          outerCount
        );


      outerPetals.castShadow =
        true;


      for (
        let i = 0;
        i < outerCount;
        i++
      ) {

        const angle =
          (
            i /
            outerCount
          ) *
          Math.PI *
          2;


        const variation =
          Math.sin(
            i * 8.71
          ) *
          0.035;


        const distance =
          radius *
          (
            0.73 +
            variation
          );


        dummy.position.set(
          Math.sin(angle) *
            distance,

          Math.cos(angle) *
            distance,

          -0.03
        );


        dummy.rotation.set(
          Math.sin(i) *
            0.045,

          Math.cos(i) *
            0.035,

          -angle
        );


        dummy.scale.set(
          radius * 0.16,

          radius *
            (
              0.46 +
              variation
            ),

          radius * 0.055
        );


        dummy.updateMatrix();


        outerPetals.setMatrixAt(
          i,
          dummy.matrix
        );
      }


      flower.add(
        outerPetals
      );


      /*
        INNER PETALS
      */

      const innerCount =
        20;


      const innerPetals =
        new THREE.InstancedMesh(
          petalGeometry,
          innerPetalMaterial,
          innerCount
        );


      for (
        let i = 0;
        i < innerCount;
        i++
      ) {

        const angle =
          (
            i /
            innerCount
          ) *
          Math.PI *
          2 +
          0.12;


        const distance =
          radius *
          0.56;


        dummy.position.set(
          Math.sin(angle) *
            distance,

          Math.cos(angle) *
            distance,

          0
        );


        dummy.rotation.set(
          0,
          0,
          -angle
        );


        dummy.scale.set(
          radius *
            0.145,

          radius *
            0.35,

          radius *
            0.06
        );


        dummy.updateMatrix();


        innerPetals.setMatrixAt(
          i,
          dummy.matrix
        );
      }


      flower.add(
        innerPetals
      );


      /*
        CENTER
      */

      const center =
        new THREE.Mesh(
          centerGeometry,
          centerMaterial
        );


      center.scale.set(
        radius * 0.51,
        radius * 0.51,
        radius * 0.17
      );


      center.position.z =
        radius * 0.045;


      flower.add(
        center
      );


      /*
        SEEDS
      */

      const seedCount =
        66;


      const seeds =
        new THREE.InstancedMesh(
          seedGeometry,
          seedMaterial,
          seedCount
        );


      const goldenAngle =
        Math.PI *
        (
          3 -
          Math.sqrt(5)
        );


      for (
        let i = 0;
        i < seedCount;
        i++
      ) {

        const normalized =
          (
            i +
            0.5
          ) /
          seedCount;


        const r =
          Math.sqrt(
            normalized
          ) *
          radius *
          0.43;


        const angle =
          i *
          goldenAngle;


        dummy.position.set(
          Math.cos(angle) *
            r,

          Math.sin(angle) *
            r,

          radius *
            0.19
        );


        dummy.scale.setScalar(
          radius *
            0.025
        );


        dummy.rotation.z =
          angle;


        dummy.updateMatrix();


        seeds.setMatrixAt(
          i,
          dummy.matrix
        );
      }


      flower.add(
        seeds
      );


      return flower;
    }


    const up =
      new THREE.Vector3(
        0,
        1,
        0
      );


    function createStem(
      from,
      to,
      thickness = 0.045
    ) {

      const direction =
        new THREE.Vector3()
          .subVectors(
            to,
            from
          );


      const length =
        direction.length();


      const stem =
        new THREE.Mesh(
          stemGeometry,
          stemMaterial
        );


      stem.position
        .copy(from)
        .add(to)
        .multiplyScalar(0.5);


      stem.scale.set(
        thickness,
        length,
        thickness
      );


      stem.quaternion
        .setFromUnitVectors(
          up,
          direction
            .clone()
            .normalize()
        );


      return stem;
    }


    function createLeaf(
      position,
      side,
      size = 1,
      twist = 0
    ) {

      const leaf =
        new THREE.Mesh(
          leafGeometry,
          leafMaterial
        );


      leaf.position.copy(
        position
      );


      leaf.position.x +=
        side *
        0.18 *
        size;


      leaf.scale.set(
        0.18 * size,
        0.56 * size,
        0.045 * size
      );


      leaf.rotation.z =
        side *
        (
          0.85 +
          twist
        );


      leaf.rotation.x =
        side *
        0.17;


      return leaf;
    }


    const flowers = [

      {
        x: -1.30,
        y: 1.76,
        z: -0.15,
        size: 0.88,
        rz: -0.18
      },

      {
        x: -0.63,
        y: 2.55,
        z: 0,
        size: 0.94,
        rz: -0.08
      },

      {
        x: 0.28,
        y: 2.74,
        z: -0.25,
        size: 1.00,
        rz: 0.08
      },

      {
        x: 1.12,
        y: 1.93,
        z: 0.03,
        size: 0.90,
        rz: 0.17
      },

      {
        x: -0.88,
        y: 0.82,
        z: 0.31,
        size: 0.78,
        rz: -0.13
      },

      {
        x: 0.08,
        y: 1.25,
        z: 0.61,
        size: 0.91,
        rz: 0.03
      },

      {
        x: 1.02,
        y: 0.86,
        z: 0.28,
        size: 0.76,
        rz: 0.17
      }

    ];


    const bouquetBase =
      new THREE.Vector3(
        0,
        -3.18,
        -0.03
      );


    flowers.forEach(
      (
        config,
        index
      ) => {

        const head =
          createSunflower(
            config.size
          );


        head.position.set(
          config.x,
          config.y,
          config.z
        );


        head.rotation.z =
          config.rz;


        bouquet.add(
          head
        );


        flowerHeads.push({
          mesh: head,
          initial:
            config.rz,
          phase:
            index * 0.9
        });


        const top =
          new THREE.Vector3(
            config.x,
            config.y,
            config.z -
              0.18
          );


        const bottom =
          bouquetBase
            .clone();


        bottom.x +=
          (
            index -
            3
          ) *
          0.025;


        bouquet.add(
          createStem(
            bottom,
            top
          )
        );


        const leafPoint =
          bottom
            .clone()
            .lerp(
              top,
              0.42 +
              (
                index %
                3
              ) *
              0.07
            );


        bouquet.add(
          createLeaf(
            leafPoint,

            index %
              2 ===
              0
              ? -1
              : 1,

            0.85 +
              (
                index %
                3
              ) *
              0.07
          )
        );

      }
    );


    /* ============================================================
       WRAPPING
       ============================================================ */

    const wrapper =
      new THREE.Mesh(

        new THREE.CylinderGeometry(
          1.52,
          0.36,
          3.2,
          36,
          1,
          true
        ),

        paperMaterial
      );


    wrapper.position.set(
      0,
      -1.33,
      -0.06
    );


    bouquet.add(
      wrapper
    );


    const wrapperHighlight =
      new THREE.Mesh(
        wrapper.geometry,
        paperLightMaterial
      );


    wrapperHighlight.position.set(
      0.12,
      -1.27,
      0.02
    );


    wrapperHighlight.rotation.y =
      0.5;


    wrapperHighlight.scale.setScalar(
      0.94
    );


    bouquet.add(
      wrapperHighlight
    );


    /* ============================================================
       RIBBON
       ============================================================ */

    const ribbon =
      new THREE.Mesh(

        new THREE.TorusGeometry(
          0.42,
          0.05,
          10,
          40
        ),

        ribbonMaterial
      );


    ribbon.position.set(
      0,
      -1.76,
      0.05
    );


    ribbon.rotation.x =
      Math.PI /
      2;


    bouquet.add(
      ribbon
    );


    const ribbonTailGeometry =
      new THREE.BoxGeometry(
        0.09,
        0.95,
        0.035
      );


    const ribbonLeft =
      new THREE.Mesh(
        ribbonTailGeometry,
        ribbonMaterial
      );


    ribbonLeft.position.set(
      -0.14,
      -2.15,
      0.14
    );


    ribbonLeft.rotation.z =
      0.2;


    bouquet.add(
      ribbonLeft
    );


    const ribbonRight =
      new THREE.Mesh(
        ribbonTailGeometry,
        ribbonMaterial
      );


    ribbonRight.position.set(
      0.14,
      -2.15,
      0.12
    );


    ribbonRight.rotation.z =
      -0.22;


    bouquet.add(
      ribbonRight
    );


    /* ============================================================
       MOUSE MOVEMENT
       ============================================================ */

    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;


    window.addEventListener(
      "pointermove",
      event => {

        if (
          event.pointerType ===
          "touch"
        ) {
          return;
        }


        const x =
          (
            event.clientX /
            window.innerWidth
          ) *
          2 -
          1;


        const y =
          (
            event.clientY /
            window.innerHeight
          ) *
          2 -
          1;


        targetX =
          y *
          0.045;


        targetY =
          x *
          0.11;

      },
      {
        passive: true
      }
    );


    /* ============================================================
       RESPONSIVE THREE.JS
       ============================================================ */

    function resizeThreeScene() {

      const rect =
        flowerArea
          .getBoundingClientRect();


      const width =
        Math.max(
          rect.width,
          1
        );


      const height =
        Math.max(
          rect.height,
          1
        );


      const mobile =
        window.innerWidth <=
        700;


      renderer.setSize(
        width,
        height,
        false
      );


      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio,
          mobile
            ? 1.35
            : 1.8
        )
      );


      camera.aspect =
        width /
        height;


      camera.updateProjectionMatrix();


      /*
        IMPORTANT:
        These values are different on mobile.
      */

      if (mobile) {

        camera.position.set(
          0,
          0.15,
          12
        );


        bouquet.position.set(
          0,
          -0.15,
          0
        );


        bouquet.scale.setScalar(
          0.70
        );

      } else {

        camera.position.set(
          0,
          0,
          10.6
        );


        bouquet.position.set(
          0,
          -0.08,
          0
        );


        bouquet.scale.setScalar(
          0.98
        );

      }


      camera.lookAt(
        0,
        0,
        0
      );
    }


    window.addEventListener(
      "resize",
      resizeThreeScene
    );


    resizeThreeScene();


    /* ============================================================
       THREE.JS ANIMATION
       ============================================================ */

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );


    const clock =
      new THREE.Clock();


    function animateThree() {

      const time =
        clock.getElapsedTime();


      if (
        !reducedMotion.matches
      ) {

        currentX =
          THREE.MathUtils.lerp(
            currentX,
            targetX,
            0.025
          );


        currentY =
          THREE.MathUtils.lerp(
            currentY,
            targetY,
            0.025
          );


        bouquet.rotation.x =
          currentX +
          Math.sin(
            time * 0.42
          ) *
          0.007;


        bouquet.rotation.y =
          currentY +
          Math.sin(
            time * 0.31
          ) *
          0.022;


        bouquet.rotation.z =
          Math.sin(
            time * 0.25
          ) *
          0.006;


        flowerHeads.forEach(
          (
            flower,
            index
          ) => {

            flower.mesh.rotation.z =
              flower.initial +
              Math.sin(
                time * 0.62 +
                flower.phase
              ) *
              0.011;

          }
        );

      }


      renderer.render(
        scene,
        camera
      );


      requestAnimationFrame(
        animateThree
      );
    }


    animateThree();


    /* ============================================================
       FIREWORKS
       ============================================================ */

    const fireCanvas =
      document.querySelector(
        "#fireworks"
      );


    const ctx =
      fireCanvas.getContext(
        "2d"
      );


    let fireWidth = 0;
    let fireHeight = 0;


    const particles = [];

    const stars = [];


    function resizeFireworks() {

      const dpr =
        Math.min(
          window.devicePixelRatio,
          1.5
        );


      fireWidth =
        window.innerWidth;


      fireHeight =
        window.innerHeight;


      fireCanvas.width =
        fireWidth *
        dpr;


      fireCanvas.height =
        fireHeight *
        dpr;


      fireCanvas.style.width =
        fireWidth +
        "px";


      fireCanvas.style.height =
        fireHeight +
        "px";


      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );


      createStars();
    }


    function createStars() {

      stars.length = 0;


      const amount =
        Math.min(
          95,
          Math.floor(
            fireWidth /
            11
          )
        );


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        stars.push({

          x:
            Math.random() *
            fireWidth,

          y:
            Math.random() *
            fireHeight,

          radius:
            Math.random() *
            0.8 +
            0.15,

          alpha:
            Math.random() *
            0.4 +
            0.08

        });
      }
    }


    window.addEventListener(
      "resize",
      resizeFireworks
    );


    resizeFireworks();


    /*
      Warm colour palette so it matches the sunflowers.
    */

    const fireworkColors = [

      [255, 220, 126],

      [255, 244, 210],

      [255, 185, 74],

      [255, 211, 105],

      [255, 153, 90]

    ];


    function createFirework(
      x,
      y,
      amount = 48
    ) {

      const color =
        fireworkColors[
          Math.floor(
            Math.random() *
            fireworkColors.length
          )
        ];


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        const angle =
          Math.random() *
          Math.PI *
          2;


        const speed =
          Math.random() *
          2.6 +
          0.7;


        particles.push({

          x,
          y,

          vx:
            Math.cos(angle) *
            speed,

          vy:
            Math.sin(angle) *
            speed,

          life:
            Math.random() *
            32 +
            45,

          maxLife:
            77,

          gravity:
            0.018,

          friction:
            0.985,

          size:
            Math.random() *
            1.4 +
            0.35,

          color

        });
      }
    }


    function randomFirework() {

      /*
        Keep fireworks mostly near edges so
        they don't destroy readability.
      */

      const leftSide =
        Math.random() <
        0.5;


      const x =
        leftSide

          ? fireWidth *
            (
              0.04 +
              Math.random() *
              0.24
            )

          : fireWidth *
            (
              0.72 +
              Math.random() *
              0.23
            );


      const y =
        fireHeight *
        (
          0.08 +
          Math.random() *
          0.47
        );


      createFirework(
        x,
        y,

        window.innerWidth <=
          700

          ? 32

          : 48
      );
    }


    let nextFirework =
      performance.now() +
      1000;


    function animateFireworks(
      now
    ) {

      ctx.clearRect(
        0,
        0,
        fireWidth,
        fireHeight
      );


      /*
        Tiny background stars
      */

      for (
        const star of stars
      ) {

        ctx.beginPath();

        ctx.arc(
          star.x,
          star.y,
          star.radius,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `rgba(
            255,
            226,
            150,
            ${star.alpha}
          )`;


        ctx.fill();
      }


      if (
        !reducedMotion.matches &&
        now >
          nextFirework
      ) {

        randomFirework();


        nextFirework =
          now +
          1600 +
          Math.random() *
          1700;
      }


      for (
        let i =
          particles.length -
          1;

        i >= 0;

        i--
      ) {

        const p =
          particles[i];


        p.vx *=
          p.friction;


        p.vy *=
          p.friction;


        p.vy +=
          p.gravity;


        p.x +=
          p.vx;


        p.y +=
          p.vy;


        p.life--;


        const alpha =
          Math.max(
            0,
            p.life /
            p.maxLife
          );


        ctx.beginPath();


        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI *
          2
        );


        ctx.fillStyle =
          `rgba(
            ${p.color[0]},
            ${p.color[1]},
            ${p.color[2]},
            ${alpha * 0.7}
          )`;


        ctx.fill();


        /*
          Firework trail
        */

        ctx.beginPath();

        ctx.moveTo(
          p.x,
          p.y
        );


        ctx.lineTo(
          p.x -
          p.vx *
          3,

          p.y -
          p.vy *
          3
        );


        ctx.strokeStyle =
          `rgba(
            ${p.color[0]},
            ${p.color[1]},
            ${p.color[2]},
            ${alpha * 0.22}
          )`;


        ctx.lineWidth =
          Math.max(
            0.3,
            p.size *
            0.5
          );


        ctx.stroke();


        if (
          p.life <= 0
        ) {

          particles.splice(
            i,
            1
          );
        }
      }


      requestAnimationFrame(
        animateFireworks
      );
    }


    requestAnimationFrame(
      animateFireworks
    );


    /*
      Clicking / tapping creates a firework.
    */

    window.addEventListener(
      "pointerdown",
      event => {

        if (
          reducedMotion.matches
        ) {
          return;
        }


        createFirework(
          event.clientX,
          event.clientY,

          window.innerWidth <=
            700

            ? 30

            : 44
        );

      },
      {
        passive: true
      }
    );

  </script>

</body>
</html>
