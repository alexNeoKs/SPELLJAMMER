<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#050805" />

  <title>卿卿生辰喜乐</title>

  <style>
    :root {
      --white: rgba(255, 255, 255, 0.96);
      --paper-dark: #332516;
      --seal-red: #792d23;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #050805;
    }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 25% 40%,
          rgba(40, 61, 32, 0.26),
          transparent 34%
        ),
        radial-gradient(
          circle at 72% 48%,
          rgba(84, 57, 17, 0.08),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #091009 0%,
          #050805 50%,
          #020302 100%
        );

      color: var(--white);

      font-family:
        "Songti SC",
        "Noto Serif CJK SC",
        "STSong",
        "SimSun",
        serif;
    }

    /* =========================================================
       FIREWORK BACKGROUND
       ========================================================= */

    #fireworks {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;

      pointer-events: none;
    }

    .background-vignette {
      position: fixed;
      inset: 0;

      z-index: 1;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 32%,
          rgba(0, 0, 0, 0.14) 65%,
          rgba(0, 0, 0, 0.5) 100%
        );
    }

    /* =========================================================
       MAIN PAGE
       ========================================================= */

    .page {
      position: relative;
      z-index: 2;

      min-height: 100svh;

      display: grid;

      grid-template-columns:
        minmax(0, 57%)
        minmax(360px, 43%);

      align-items: stretch;
    }

    /* =========================================================
       FLOWER AREA
       ========================================================= */

    .flower-area {
      position: relative;

      min-width: 0;
      min-height: 100svh;

      overflow: hidden;
    }

    #scene {
      position: absolute;
      inset: 0;

      display: block;

      width: 100%;
      height: 100%;

      outline: none;

      touch-action: pan-y;
    }

    .flower-glow {
      position: absolute;

      left: 50%;
      top: 45%;

      width: 75%;
      aspect-ratio: 1;

      transform: translate(-50%, -50%);

      pointer-events: none;

      background:
        radial-gradient(
          circle,
          rgba(255, 204, 72, 0.08),
          transparent 66%
        );

      filter: blur(35px);
    }

    .hint {
      position: absolute;

      left: 20px;
      bottom: 18px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;

      color:
        rgba(255, 255, 255, 0.35);

      pointer-events: none;
    }

    /* =========================================================
       LETTER AREA
       ========================================================= */

    .poem-area {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(45px, 6vh)
        clamp(42px, 5vw, 90px)
        max(45px, 6vh)
        clamp(20px, 2.5vw, 45px);

      perspective: 1200px;
    }

    /* =========================================================
       QIAOPI LETTER
       ========================================================= */

    .qiaopi-letter {
      position: relative;

      width: min(100%, 520px);

      padding:
        55px
        54px
        48px;

      color: var(--paper-dark);

      background:
        radial-gradient(
          circle at 14% 18%,
          rgba(108, 68, 27, 0.1),
          transparent 16%
        ),
        radial-gradient(
          circle at 82% 77%,
          rgba(125, 72, 28, 0.08),
          transparent 20%
        ),
        radial-gradient(
          circle at 70% 16%,
          rgba(80, 45, 20, 0.045),
          transparent 17%
        ),
        repeating-linear-gradient(
          92deg,
          rgba(90, 55, 25, 0.018) 0,
          rgba(90, 55, 25, 0.018) 1px,
          transparent 1px,
          transparent 4px
        ),
        linear-gradient(
          145deg,
          #e5cd9d 0%,
          #f0ddb4 26%,
          #e5cc99 66%,
          #d5b77e 100%
        );

      border:
        1px solid
        rgba(83, 50, 23, 0.55);

      box-shadow:
        0 35px 80px rgba(0, 0, 0, 0.55),
        0 10px 30px rgba(0, 0, 0, 0.34),
        inset 0 0 48px rgba(105, 65, 27, 0.19);

      transform:
        rotateY(-2deg)
        rotateZ(0.5deg);

      transform-origin: center;

      isolation: isolate;
    }

    .qiaopi-letter::before {
      content: "";

      position: absolute;
      inset: 8px;

      pointer-events: none;

      border:
        1px solid
        rgba(127, 44, 26, 0.55);

      opacity: 0.72;
    }

    .qiaopi-letter::after {
      content: "";

      position: absolute;
      inset: 14px;

      pointer-events: none;

      border:
        1px dashed
        rgba(143, 54, 31, 0.25);
    }

    /* =========================================================
       LETTER HEADER
       ========================================================= */

    .letter-header {
      position: relative;
      z-index: 3;

      display: flex;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 25px;
      padding-bottom: 10px;

      border-bottom:
        1px solid
        rgba(71, 43, 23, 0.23);

      color:
        rgba(66, 38, 20, 0.72);

      font-size: 12px;

      letter-spacing: 0.18em;
    }

    /* =========================================================
       POEM
       ========================================================= */

    .poem {
      position: relative;
      z-index: 3;

      color: #322418;

      font-family:
        "STKaiti",
        "KaiTi",
        "Kaiti SC",
        "Songti SC",
        "STSong",
        serif;
    }

    .letter-title {
      margin-bottom: 26px;

      text-align: center;

      font-size:
        clamp(19px, 1.5vw, 25px);

      letter-spacing: 0.3em;

      color: #722d21;
    }

    .poem p {
      margin: 0 0 25px;

      font-size:
        clamp(17px, 1.2vw, 22px);

      line-height: 1.95;

      letter-spacing: 0.08em;

      font-weight: 400;
    }

    .poem p:last-child {
      margin-bottom: 0;
    }

    .poem .ending {
      color: #692b23;

      font-weight: 500;
    }

    /* =========================================================
       POSTAL MARKS
       ========================================================= */

    .postal-mark {
      position: absolute;
      z-index: 4;

      color:
        rgba(113, 34, 25, 0.62);

      border:
        1px solid
        rgba(113, 34, 25, 0.48);

      font-family:
        "STKaiti",
        "KaiTi",
        serif;

      pointer-events: none;
    }

    .postal-mark-top {
      top: 23px;
      right: 29px;

      padding: 4px 7px;

      font-size: 11px;

      letter-spacing: 0.2em;

      transform: rotate(-3deg);
    }

    .postal-mark-side {
      left: 19px;
      top: 46%;

      padding: 8px 4px;

      writing-mode: vertical-rl;

      letter-spacing: 0.14em;

      font-size: 11px;

      transform: rotate(2deg);
    }

    /* =========================================================
       RED SEALS
       ========================================================= */

    .stamp {
      position: absolute;
      z-index: 5;

      display: grid;
      place-items: center;

      color:
        rgba(143, 31, 25, 0.67);

      border:
        2px solid
        rgba(143, 31, 25, 0.6);

      font-family:
        "STKaiti",
        "KaiTi",
        serif;

      line-height: 1;

      pointer-events: none;

      mix-blend-mode: multiply;
    }

    .stamp::before {
      content: "";

      position: absolute;
      inset: 3px;

      border:
        1px solid
        rgba(143, 31, 25, 0.45);
    }

    .stamp-one {
      width: 48px;
      height: 48px;

      right: 21px;
      bottom: 27px;

      font-size: 25px;

      transform: rotate(8deg);

      border-radius: 4px;
    }

    .stamp-two {
      width: 37px;
      height: 37px;

      right: 56px;
      bottom: 18px;

      font-size: 19px;

      opacity: 0.48;

      transform: rotate(-11deg);

      border-radius: 50%;
    }

    /* =========================================================
       PAPER FOLDS
       ========================================================= */

    .letter-fold {
      position: absolute;
      z-index: 1;

      pointer-events: none;
    }

    .fold-one {
      left: 0;
      right: 0;
      top: 47%;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(92, 57, 27, 0.16),
          rgba(255, 246, 218, 0.25),
          rgba(92, 57, 27, 0.13),
          transparent
        );

      box-shadow:
        0 1px 2px
        rgba(72, 42, 20, 0.08);
    }

    .fold-two {
      top: 0;
      bottom: 0;
      left: 52%;

      width: 1px;

      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(92, 57, 27, 0.09),
          rgba(255, 246, 218, 0.18),
          rgba(92, 57, 27, 0.08),
          transparent
        );
    }

    /* =========================================================
       SIGNATURE
       ========================================================= */

    .letter-signature {
      position: relative;
      z-index: 6;

      display: flex;
      justify-content: flex-end;
      align-items: flex-end;

      gap: 12px;

      margin-top: 28px;

      color:
        rgba(70, 38, 21, 0.78);

      font-family:
        "STKaiti",
        "KaiTi",
        "Kaiti SC",
        "Songti SC",
        serif;
    }

    .signature-person {
      display: flex;
      flex-direction: column;
      align-items: flex-end;

      gap: 2px;
    }

    .signature-name {
      font-size: 19px;

      letter-spacing: 0.16em;

      color: #54261d;
    }

    .signature-action {
      font-size: 11px;

      letter-spacing: 0.2em;

      opacity: 0.72;
    }

    .signature-seal {
      position: relative;

      width: 32px;
      height: 32px;

      display: grid;
      place-items: center;

      border:
        2px solid
        rgba(142, 36, 27, 0.62);

      color:
        rgba(142, 36, 27, 0.68);

      font-size: 18px;

      line-height: 1;

      transform: rotate(5deg);

      mix-blend-mode: multiply;
    }

    .signature-seal::before {
      content: "";

      position: absolute;
      inset: 3px;

      border:
        1px solid
        rgba(142, 36, 27, 0.38);
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 1024px) {

      body {
        overflow-y: auto;
      }

      .page {
        display: block;

        width: 100%;

        min-height: 100svh;
      }

      .flower-area {
        position: relative;

        width: 100%;

        height: 54svh;
        min-height: 54svh;
      }

      .flower-glow {
        width: min(95vw, 720px);

        top: 48%;
      }

      .poem-area {
        width: 100%;

        min-height: auto;

        display: flex;

        align-items: flex-start;
        justify-content: center;

        padding:
          10px
          clamp(28px, 6vw, 70px)
          70px;
      }

      .qiaopi-letter {
        width: min(88vw, 610px);

        max-width: 610px;

        padding:
          58px
          clamp(42px, 6vw, 64px)
          50px;

        transform:
          rotateZ(-0.3deg);

        box-shadow:
          0 30px 70px
          rgba(0, 0, 0, 0.52);
      }

      .letter-header {
        margin-bottom: 24px;

        font-size: 12px;
      }

      .letter-title {
        margin-bottom: 24px;

        font-size:
          clamp(20px, 2.8vw, 25px);
      }

      .poem {
        text-align: center;
      }

      .poem p {
        margin-bottom: 24px;

        font-size:
          clamp(17px, 2.35vw, 21px);

        line-height: 1.9;

        letter-spacing: 0.065em;
      }

      .letter-signature {
        margin-top: 26px;
      }

      .hint {
        display: none;
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .flower-area {
        height: 49svh;
        min-height: 49svh;
      }

      .flower-glow {
        width: 110%;

        top: 48%;
      }

      .poem-area {
        padding:
          3px
          max(
            16px,
            env(safe-area-inset-right)
          )
          max(
            48px,
            calc(
              28px +
              env(safe-area-inset-bottom)
            )
          )
          max(
            16px,
            env(safe-area-inset-left)
          );
      }

      .qiaopi-letter {
        width: 100%;

        max-width: 480px;

        padding:
          47px
          32px
          42px;

        transform:
          rotateZ(-0.35deg);
      }

      .letter-header {
        margin-bottom: 20px;

        font-size: 10px;
      }

      .letter-title {
        margin-bottom: 20px;

        font-size: 18px;
      }

      .poem p {
        margin-bottom: 21px;

        font-size:
          clamp(
            14px,
            4vw,
            18px
          );

        line-height: 1.8;

        letter-spacing: 0.045em;
      }

      .postal-mark-side {
        left: 12px;
      }

      .postal-mark-top {
        top: 18px;
        right: 21px;
      }

      .stamp-one {
        width: 41px;
        height: 41px;

        right: 17px;
        bottom: 19px;

        font-size: 21px;
      }

      .stamp-two {
        width: 31px;
        height: 31px;

        right: 47px;
        bottom: 14px;

        font-size: 16px;
      }

      .letter-signature {
        margin-top: 22px;
      }

      .signature-name {
        font-size: 17px;
      }

      .signature-seal {
        width: 29px;
        height: 29px;

        font-size: 16px;
      }
    }

    /* =========================================================
       SMALL PHONES
       ========================================================= */

    @media (max-width: 390px) {

      .flower-area {
        height: 46svh;
        min-height: 46svh;
      }

      .qiaopi-letter {
        padding:
          43px
          24px
          39px;
      }

      .poem p {
        font-size: 14px;

        line-height: 1.7;
      }

      .letter-title {
        font-size: 17px;
      }

      .signature-name {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hint {
        display: none;
      }
    }
  </style>
</head>

<body>

  <canvas id="fireworks"></canvas>

  <div class="background-vignette"></div>

  <main class="page">

    <!-- =====================================================
         3D FLOWERS
         ===================================================== -->

    <section class="flower-area">

      <canvas
        id="scene"
        aria-hidden="true"
      ></canvas>

      <div class="flower-glow"></div>

      <div class="hint">
        move to admire the flowers
      </div>

    </section>

    <!-- =====================================================
         QIAOPI LETTER
         ===================================================== -->

    <section class="poem-area">

      <article class="qiaopi-letter">

        <div class="postal-mark postal-mark-top">
          侨 批
        </div>

        <div class="postal-mark postal-mark-side">
          平 安
        </div>

        <div class="stamp stamp-one">
          福
        </div>

        <div class="stamp stamp-two">
          安
        </div>

        <div class="letter-fold fold-one"></div>
        <div class="letter-fold fold-two"></div>

        <div class="letter-header">
          <span>寄卿卿</span>
          <span>岁次丙午</span>
        </div>

        <div class="poem">

          <div class="letter-title">
            生辰小笺
          </div>

          <p>
            愿卿长似花初绽，<br>
            无忧无恙少尘埃。<br>
            年年今日同相守，<br>
            共看灯火照楼台。
          </p>

          <p>
            若问此心何所愿，<br>
            唯愿卿安，唯愿卿欢；<br>
            春秋与共，白首不改。
          </p>

          <p class="ending">
            卿卿生辰喜乐，<br>
            愿岁岁长安，年年有我。
          </p>

        </div>

        <div class="letter-signature">

          <div class="signature-person">
            <span class="signature-name">
              梁家硕
            </span>

            <span class="signature-action">
              谨书
            </span>
          </div>

          <div class="signature-seal">
            梁
          </div>

        </div>

      </article>

    </section>

  </main>

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js";

    /* ============================================================
       THREE.JS SETUP
       ============================================================ */

    const canvas =
      document.querySelector("#scene");

    const flowerArea =
      document.querySelector(".flower-area");

    const scene =
      new THREE.Scene();

    const camera =
      new THREE.PerspectiveCamera(
        42,
        1,
        0.1,
        100
      );

    const renderer =
      new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
      1.08;

    renderer.shadowMap.enabled =
      true;

    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;

    /* ============================================================
       LIGHTING
       ============================================================ */

    const hemisphereLight =
      new THREE.HemisphereLight(
        0xfff3ce,
        0x142014,
        1.8
      );

    scene.add(
      hemisphereLight
    );

    const keyLight =
      new THREE.DirectionalLight(
        0xffe1a0,
        4
      );

    keyLight.position.set(
      -4,
      7,
      7
    );

    keyLight.castShadow =
      true;

    scene.add(
      keyLight
    );

    const goldenLight =
      new THREE.PointLight(
        0xffbd42,
        22,
        16,
        2
      );

    goldenLight.position.set(
      -3,
      2,
      5
    );

    scene.add(
      goldenLight
    );

    const rimLight =
      new THREE.PointLight(
        0xfff4d0,
        14,
        15,
        2
      );

    rimLight.position.set(
      3,
      4,
      -2
    );

    scene.add(
      rimLight
    );

    /* ============================================================
       MATERIALS
       ============================================================ */

    const outerPetalMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xffca39,
        roughness: 0.46
      });

    const innerPetalMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xffad22,
        roughness: 0.48
      });

    const centerMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x3a1a09,
        roughness: 0.9
      });

    const seedMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xd56b1d,
        roughness: 0.7
      });

    const stemMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x426d28,
        roughness: 0.8
      });

    const leafMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x668d38,
        roughness: 0.88,
        side: THREE.DoubleSide
      });

    const wrappingMaterial =
      new THREE.MeshPhysicalMaterial({
        color: 0xcfbd91,
        roughness: 0.85,
        transparent: true,
        opacity: 0.39,
        side: THREE.DoubleSide,
        depthWrite: false
      });

    const wrappingHighlightMaterial =
      new THREE.MeshPhysicalMaterial({
        color: 0xf4deb0,
        roughness: 0.85,
        transparent: true,
        opacity: 0.14,
        side: THREE.DoubleSide,
        depthWrite: false
      });

    const ribbonMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xe1b54c,
        roughness: 0.5
      });

    /* ============================================================
       SHARED GEOMETRY
       ============================================================ */

    const petalGeometry =
      new THREE.SphereGeometry(
        1,
        12,
        8
      );

    const centerGeometry =
      new THREE.SphereGeometry(
        1,
        24,
        16
      );

    const seedGeometry =
      new THREE.IcosahedronGeometry(
        1,
        0
      );

    const stemGeometry =
      new THREE.CylinderGeometry(
        1,
        1,
        1,
        10
      );

    const leafGeometry =
      new THREE.SphereGeometry(
        1,
        14,
        8
      );

    /* ============================================================
       BOUQUET
       ============================================================ */

    const bouquet =
      new THREE.Group();

    scene.add(
      bouquet
    );

    const flowerHeads = [];

    function createSunflower(
      radius = 1
    ) {

      const flower =
        new THREE.Group();

      const dummy =
        new THREE.Object3D();

      /* OUTER PETALS */

      const outerCount =
        28;

      const outerPetals =
        new THREE.InstancedMesh(
          petalGeometry,
          outerPetalMaterial,
          outerCount
        );

      outerPetals.castShadow =
        true;

      for (
        let i = 0;
        i < outerCount;
        i++
      ) {

        const angle =
          (
            i /
            outerCount
          ) *
          Math.PI *
          2;

        const variation =
          Math.sin(
            i * 8.71
          ) *
          0.035;

        const distance =
          radius *
          (
            0.73 +
            variation
          );

        dummy.position.set(
          Math.sin(angle) *
            distance,

          Math.cos(angle) *
            distance,

          -0.03
        );

        dummy.rotation.set(
          Math.sin(i) *
            0.045,

          Math.cos(i) *
            0.035,

          -angle
        );

        dummy.scale.set(
          radius * 0.16,

          radius *
            (
              0.46 +
              variation
            ),

          radius * 0.055
        );

        dummy.updateMatrix();

        outerPetals.setMatrixAt(
          i,
          dummy.matrix
        );
      }

      outerPetals.instanceMatrix.needsUpdate =
        true;

      flower.add(
        outerPetals
      );

      /* INNER PETALS */

      const innerCount =
        20;

      const innerPetals =
        new THREE.InstancedMesh(
          petalGeometry,
          innerPetalMaterial,
          innerCount
        );

      for (
        let i = 0;
        i < innerCount;
        i++
      ) {

        const angle =
          (
            i /
            innerCount
          ) *
          Math.PI *
          2 +
          0.12;

        const distance =
          radius *
          0.56;

        dummy.position.set(
          Math.sin(angle) *
            distance,

          Math.cos(angle) *
            distance,

          0
        );

        dummy.rotation.set(
          0,
          0,
          -angle
        );

        dummy.scale.set(
          radius * 0.145,
          radius * 0.35,
          radius * 0.06
        );

        dummy.updateMatrix();

        innerPetals.setMatrixAt(
          i,
          dummy.matrix
        );
      }

      innerPetals.instanceMatrix.needsUpdate =
        true;

      flower.add(
        innerPetals
      );

      /* CENTER */

      const center =
        new THREE.Mesh(
          centerGeometry,
          centerMaterial
        );

      center.scale.set(
        radius * 0.51,
        radius * 0.51,
        radius * 0.17
      );

      center.position.z =
        radius * 0.045;

      flower.add(
        center
      );

      /* SEEDS */

      const seedCount =
        66;

      const seeds =
        new THREE.InstancedMesh(
          seedGeometry,
          seedMaterial,
          seedCount
        );

      const goldenAngle =
        Math.PI *
        (
          3 -
          Math.sqrt(5)
        );

      for (
        let i = 0;
        i < seedCount;
        i++
      ) {

        const normalized =
          (
            i +
            0.5
          ) /
          seedCount;

        const r =
          Math.sqrt(
            normalized
          ) *
          radius *
          0.43;

        const angle =
          i *
          goldenAngle;

        dummy.position.set(
          Math.cos(angle) *
            r,

          Math.sin(angle) *
            r,

          radius * 0.19
        );

        dummy.scale.setScalar(
          radius *
          0.025
        );

        dummy.rotation.z =
          angle;

        dummy.updateMatrix();

        seeds.setMatrixAt(
          i,
          dummy.matrix
        );
      }

      seeds.instanceMatrix.needsUpdate =
        true;

      flower.add(
        seeds
      );

      return flower;
    }

    /* ============================================================
       STEMS
       ============================================================ */

    const up =
      new THREE.Vector3(
        0,
        1,
        0
      );

    function createStem(
      from,
      to,
      thickness = 0.045
    ) {

      const direction =
        new THREE.Vector3()
          .subVectors(
            to,
            from
          );

      const length =
        direction.length();

      const stem =
        new THREE.Mesh(
          stemGeometry,
          stemMaterial
        );

      stem.position
        .copy(from)
        .add(to)
        .multiplyScalar(0.5);

      stem.scale.set(
        thickness,
        length,
        thickness
      );

      stem.quaternion
        .setFromUnitVectors(
          up,
          direction
            .clone()
            .normalize()
        );

      return stem;
    }

    /* ============================================================
       LEAVES
       ============================================================ */

    function createLeaf(
      position,
      side,
      size = 1,
      twist = 0
    ) {

      const leaf =
        new THREE.Mesh(
          leafGeometry,
          leafMaterial
        );

      leaf.position.copy(
        position
      );

      leaf.position.x +=
        side *
        0.18 *
        size;

      leaf.scale.set(
        0.18 * size,
        0.56 * size,
        0.045 * size
      );

      leaf.rotation.z =
        side *
        (
          0.85 +
          twist
        );

      leaf.rotation.x =
        side *
        0.17;

      leaf.rotation.y =
        twist *
        0.7;

      return leaf;
    }

    /* ============================================================
       FLOWERS
       ============================================================ */

    const flowers = [

      {
        x: -1.30,
        y: 1.76,
        z: -0.15,
        size: 0.88,
        rz: -0.18
      },

      {
        x: -0.63,
        y: 2.55,
        z: 0,
        size: 0.94,
        rz: -0.08
      },

      {
        x: 0.28,
        y: 2.74,
        z: -0.25,
        size: 1.00,
        rz: 0.08
      },

      {
        x: 1.12,
        y: 1.93,
        z: 0.03,
        size: 0.90,
        rz: 0.17
      },

      {
        x: -0.88,
        y: 0.82,
        z: 0.31,
        size: 0.78,
        rz: -0.13
      },

      {
        x: 0.08,
        y: 1.25,
        z: 0.61,
        size: 0.91,
        rz: 0.03
      },

      {
        x: 1.02,
        y: 0.86,
        z: 0.28,
        size: 0.76,
        rz: 0.17
      }

    ];

    const bouquetBase =
      new THREE.Vector3(
        0,
        -3.18,
        -0.03
      );

    flowers.forEach(
      (
        config,
        index
      ) => {

        const head =
          createSunflower(
            config.size
          );

        head.position.set(
          config.x,
          config.y,
          config.z
        );

        head.rotation.z =
          config.rz;

        bouquet.add(
          head
        );

        flowerHeads.push({
          mesh: head,
          initial: config.rz,
          phase: index * 0.9
        });

        const top =
          new THREE.Vector3(
            config.x,
            config.y,
            config.z - 0.18
          );

        const bottom =
          bouquetBase.clone();

        bottom.x +=
          (
            index -
            3
          ) *
          0.025;

        bouquet.add(
          createStem(
            bottom,
            top
          )
        );

        const leafPoint =
          bottom
            .clone()
            .lerp(
              top,
              0.42 +
                (
                  index %
                  3
                ) *
                0.07
            );

        const side =
          index %
            2 ===
            0
            ? -1
            : 1;

        bouquet.add(
          createLeaf(
            leafPoint,
            side,
            0.85 +
              (
                index %
                3
              ) *
              0.07
          )
        );

        if (
          index === 1 ||
          index === 4 ||
          index === 6
        ) {

          const secondLeafPoint =
            bottom
              .clone()
              .lerp(
                top,
                0.6
              );

          bouquet.add(
            createLeaf(
              secondLeafPoint,
              -side,
              0.72,
              -0.1
            )
          );
        }
      }
    );

    /* ============================================================
       WRAPPING
       ============================================================ */

    const wrapperGeometry =
      new THREE.CylinderGeometry(
        1.52,
        0.36,
        3.2,
        36,
        1,
        true
      );

    const wrapper =
      new THREE.Mesh(
        wrapperGeometry,
        wrappingMaterial
      );

    wrapper.position.set(
      0,
      -1.33,
      -0.06
    );

    bouquet.add(
      wrapper
    );

    const wrapperHighlight =
      new THREE.Mesh(
        wrapperGeometry,
        wrappingHighlightMaterial
      );

    wrapperHighlight.position.set(
      0.12,
      -1.27,
      0.02
    );

    wrapperHighlight.rotation.y =
      0.5;

    wrapperHighlight.scale.setScalar(
      0.94
    );

    bouquet.add(
      wrapperHighlight
    );

    /* ============================================================
       RIBBON
       ============================================================ */

    const ribbon =
      new THREE.Mesh(

        new THREE.TorusGeometry(
          0.42,
          0.05,
          10,
          40
        ),

        ribbonMaterial
      );

    ribbon.position.set(
      0,
      -1.76,
      0.05
    );

    ribbon.rotation.x =
      Math.PI / 2;

    bouquet.add(
      ribbon
    );

    const ribbonTailGeometry =
      new THREE.BoxGeometry(
        0.09,
        0.95,
        0.035
      );

    const ribbonLeft =
      new THREE.Mesh(
        ribbonTailGeometry,
        ribbonMaterial
      );

    ribbonLeft.position.set(
      -0.14,
      -2.15,
      0.14
    );

    ribbonLeft.rotation.z =
      0.2;

    bouquet.add(
      ribbonLeft
    );

    const ribbonRight =
      new THREE.Mesh(
        ribbonTailGeometry,
        ribbonMaterial
      );

    ribbonRight.position.set(
      0.14,
      -2.15,
      0.12
    );

    ribbonRight.rotation.z =
      -0.22;

    bouquet.add(
      ribbonRight
    );

    /* ============================================================
       POINTER MOVEMENT
       ============================================================ */

    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;

    window.addEventListener(
      "pointermove",
      event => {

        if (
          event.pointerType ===
          "touch"
        ) {
          return;
        }

        const x =
          (
            event.clientX /
            window.innerWidth
          ) *
          2 -
          1;

        const y =
          (
            event.clientY /
            window.innerHeight
          ) *
          2 -
          1;

        targetX =
          y *
          0.045;

        targetY =
          x *
          0.11;

      },
      {
        passive: true
      }
    );

    /* ============================================================
       RESPONSIVE THREE.JS
       ============================================================ */

    function resizeThreeScene() {

      const rect =
        flowerArea
          .getBoundingClientRect();

      const width =
        Math.max(
          rect.width,
          1
        );

      const height =
        Math.max(
          rect.height,
          1
        );

      const stackedLayout =
        window.innerWidth <=
        1024;

      const isPhone =
        window.innerWidth <=
        700;

      renderer.setSize(
        width,
        height,
        false
      );

      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio,
          stackedLayout
            ? 1.4
            : 1.8
        )
      );

      camera.aspect =
        width /
        height;

      camera.updateProjectionMatrix();

      if (stackedLayout) {

        camera.position.set(
          0,
          0.15,
          isPhone
            ? 12.3
            : 11.5
        );

        bouquet.position.set(
          0,
          isPhone
            ? -0.08
            : -0.18,
          0
        );

        bouquet.scale.setScalar(
          isPhone
            ? 0.69
            : 0.78
        );

      } else {

        camera.position.set(
          0,
          0,
          10.6
        );

        bouquet.position.set(
          0,
          -0.08,
          0
        );

        bouquet.scale.setScalar(
          0.98
        );
      }

      camera.lookAt(
        0,
        0,
        0
      );
    }

    window.addEventListener(
      "resize",
      resizeThreeScene
    );

    resizeThreeScene();

    /* ============================================================
       FLOWER ANIMATION
       ============================================================ */

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );

    const clock =
      new THREE.Clock();

    function animateThree() {

      const time =
        clock.getElapsedTime();

      if (
        !reducedMotion.matches
      ) {

        currentX =
          THREE.MathUtils.lerp(
            currentX,
            targetX,
            0.025
          );

        currentY =
          THREE.MathUtils.lerp(
            currentY,
            targetY,
            0.025
          );

        bouquet.rotation.x =
          currentX +
          Math.sin(
            time *
            0.42
          ) *
          0.007;

        bouquet.rotation.y =
          currentY +
          Math.sin(
            time *
            0.31
          ) *
          0.022;

        bouquet.rotation.z =
          Math.sin(
            time *
            0.25
          ) *
          0.006;

        flowerHeads.forEach(
          flower => {

            flower.mesh.rotation.z =
              flower.initial +
              Math.sin(
                time *
                0.62 +
                flower.phase
              ) *
              0.011;
          }
        );
      }

      renderer.render(
        scene,
        camera
      );

      requestAnimationFrame(
        animateThree
      );
    }

    animateThree();

    /* ============================================================
       FIREWORK CANVAS
       ============================================================ */

    const fireCanvas =
      document.querySelector(
        "#fireworks"
      );

    const ctx =
      fireCanvas.getContext(
        "2d"
      );

    let fireWidth = 0;
    let fireHeight = 0;

    const particles = [];
    const stars = [];

    function resizeFireworks() {

      const dpr =
        Math.min(
          window.devicePixelRatio,
          1.5
        );

      fireWidth =
        window.innerWidth;

      fireHeight =
        window.innerHeight;

      fireCanvas.width =
        Math.floor(
          fireWidth *
          dpr
        );

      fireCanvas.height =
        Math.floor(
          fireHeight *
          dpr
        );

      fireCanvas.style.width =
        fireWidth +
        "px";

      fireCanvas.style.height =
        fireHeight +
        "px";

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      createStars();
    }

    function createStars() {

      stars.length = 0;

      const amount =
        Math.min(
          110,
          Math.floor(
            fireWidth /
            9
          )
        );

      for (
        let i = 0;
        i < amount;
        i++
      ) {

        stars.push({

          x:
            Math.random() *
            fireWidth,

          y:
            Math.random() *
            fireHeight,

          radius:
            Math.random() *
            0.75 +
            0.15,

          alpha:
            Math.random() *
            0.4 +
            0.06,

          twinkle:
            Math.random() *
            Math.PI *
            2
        });
      }
    }

    window.addEventListener(
      "resize",
      resizeFireworks
    );

    resizeFireworks();

    /* ============================================================
       FIREWORK COLORS
       ============================================================ */

    const fireworkColors = [

      [255, 220, 126],
      [255, 244, 210],
      [255, 185, 74],
      [255, 211, 105],
      [255, 153, 90],
      [255, 232, 145],
      [255, 205, 90]

    ];

    /* ============================================================
       CREATE FIREWORK
       ============================================================ */

    function createFirework(
      x,
      y,
      amount = 48
    ) {

      const color =
        fireworkColors[
          Math.floor(
            Math.random() *
            fireworkColors.length
          )
        ];

      for (
        let i = 0;
        i < amount;
        i++
      ) {

        const angle =
          Math.random() *
          Math.PI *
          2;

        const speed =
          Math.random() *
          2.9 +
          0.8;

        particles.push({

          x,
          y,

          vx:
            Math.cos(angle) *
            speed,

          vy:
            Math.sin(angle) *
            speed,

          life:
            Math.random() *
            35 +
            48,

          maxLife:
            83,

          gravity:
            0.018,

          friction:
            0.985,

          size:
            Math.random() *
            1.45 +
            0.35,

          color
        });
      }
    }

    /* ============================================================
       RANDOM FIREWORK POSITION
       ============================================================ */

    function randomFirework() {

      const smallScreen =
        window.innerWidth <=
        1024;

      let x;
      let y;

      if (smallScreen) {

        x =
          fireWidth *
          (
            0.07 +
            Math.random() *
            0.86
          );

        y =
          fireHeight *
          (
            0.05 +
            Math.random() *
            0.47
          );

      } else {

        const leftSide =
          Math.random() <
          0.5;

        x =
          leftSide

            ? fireWidth *
              (
                0.04 +
                Math.random() *
                0.24
              )

            : fireWidth *
              (
                0.73 +
                Math.random() *
                0.23
              );

        y =
          fireHeight *
          (
            0.06 +
            Math.random() *
            0.55
          );
      }

      createFirework(
        x,
        y,

        window.innerWidth <=
          700
          ? 30
          : 48
      );
    }

    /* ============================================================
       FREQUENT FIREWORKS
       ============================================================ */

    let nextFirework =
      performance.now() +
      300;

    function animateFireworks(
      now
    ) {

      ctx.clearRect(
        0,
        0,
        fireWidth,
        fireHeight
      );

      /* STARS */

      for (
        const star of stars
      ) {

        const pulse =
          0.72 +
          Math.sin(
            now *
              0.0012 +
              star.twinkle
          ) *
          0.28;

        ctx.beginPath();

        ctx.arc(
          star.x,
          star.y,
          star.radius,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          `rgba(
            255,
            226,
            150,
            ${star.alpha * pulse}
          )`;

        ctx.fill();
      }

      /* AUTOMATIC FIREWORKS */

      if (
        !reducedMotion.matches &&
        now >
          nextFirework
      ) {

        randomFirework();

        /*
          Chance of a second burst
        */

        if (
          Math.random() <
          0.38
        ) {

          setTimeout(
            () => {

              if (
                !reducedMotion.matches
              ) {

                randomFirework();
              }

            },

            130 +
              Math.random() *
              220
          );
        }

        /*
          Roughly every 0.5 - 1.15 seconds
        */

        nextFirework =
          now +
          500 +
          Math.random() *
          650;
      }

      /* PARTICLES */

      for (
        let i =
          particles.length -
          1;

        i >= 0;

        i--
      ) {

        const p =
          particles[i];

        p.vx *=
          p.friction;

        p.vy *=
          p.friction;

        p.vy +=
          p.gravity;

        p.x +=
          p.vx;

        p.y +=
          p.vy;

        p.life--;

        const alpha =
          Math.max(
            0,
            p.life /
            p.maxLife
          );

        /* GLOW */

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.size *
            2.4,
          0,
          Math.PI *
            2
        );

        ctx.fillStyle =
          `rgba(
            ${p.color[0]},
            ${p.color[1]},
            ${p.color[2]},
            ${alpha * 0.08}
          )`;

        ctx.fill();

        /* PARTICLE */

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI *
            2
        );

        ctx.fillStyle =
          `rgba(
            ${p.color[0]},
            ${p.color[1]},
            ${p.color[2]},
            ${alpha * 0.72}
          )`;

        ctx.fill();

        /* TRAIL */

        ctx.beginPath();

        ctx.moveTo(
          p.x,
          p.y
        );

        ctx.lineTo(
          p.x -
            p.vx *
            3.3,

          p.y -
            p.vy *
            3.3
        );

        ctx.strokeStyle =
          `rgba(
            ${p.color[0]},
            ${p.color[1]},
            ${p.color[2]},
            ${alpha * 0.25}
          )`;

        ctx.lineWidth =
          Math.max(
            0.3,
            p.size *
              0.52
          );

        ctx.stroke();

        if (
          p.life <=
          0
        ) {

          particles.splice(
            i,
            1
          );
        }
      }

      requestAnimationFrame(
        animateFireworks
      );
    }

    requestAnimationFrame(
      animateFireworks
    );

    /* ============================================================
       CLICK / TAP FIREWORKS
       ============================================================ */

    window.addEventListener(
      "pointerdown",
      event => {

        if (
          reducedMotion.matches
        ) {
          return;
        }

        createFirework(
          event.clientX,
          event.clientY,

          window.innerWidth <=
            700
            ? 30
            : 45
        );

      },
      {
        passive: true
      }
    );

  </script>

</body>
</html>
