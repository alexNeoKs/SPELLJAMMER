<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Circus Time</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg">
  <div class="hearts" aria-hidden="true"></div>

  <main class="page">
    <header class="page-head">
      <h1 class="page-title">🎪 8:00 PM 🎪</h1>
      <p class="page-sub"><strong>We going to watch CIRQUE DU SOLEIL : KOOZA</strong></p>
    </header>

    <section class="scene-wrap">
      <!-- Circus/clown CSS scene -->
      <div class="circus-scene" role="img" aria-label="Circus tent with animated clowns and juggling balls">
        <div class="tent">
          <div class="tent-top"></div>
          <div class="tent-stripes"></div>
          <div class="tent-base"></div>
          <div class="flags">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="ring"></div>

        <div class="clown clown-a">
          <div class="hat"></div>
          <div class="head">
            <div class="hair left"></div>
            <div class="hair right"></div>
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="nose"></div>
              <div class="smile"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
            </div>
          </div>
          <div class="body"></div>
        </div>

        <div class="clown clown-b">
          <div class="hat"></div>
          <div class="head">
            <div class="hair left"></div>
            <div class="hair right"></div>
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="nose"></div>
              <div class="smile"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
            </div>
          </div>
          <div class="body"></div>
        </div>

        <div class="juggle" aria-hidden="true">
          <span class="ball b1"></span>
          <span class="ball b2"></span>
          <span class="ball b3"></span>
        </div>

        <div class="spotlight" aria-hidden="true"></div>
      </div>
    </section>

    <div class="nav-row">
      <a class="btn btn-yes" href="index.html">Replay 💞</a>
      <a class="btn btn-ghost" href="dinner.html">Back</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
